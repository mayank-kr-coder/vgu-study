<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VGU Study Hub</title>

<link rel="stylesheet"
href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<section class="login-screen"
id="loginScreen">

  <div class="login-card">

    <div class="login-copy">

      <p class="eyebrow">
        VGU Only
      </p>

      <h1>
        VGU notes, previous papers,
        and lab material in one place.
      </h1>

      <p>
        Student-built study library.
      </p>

    </div>

    <form
      class="login-form"
      id="loginForm">

      <div class="field">

        <label>
          Full name
        </label>

        <input
          class="control"
          id="studentName"
          required
        >

      </div>

      <div class="field">

        <label>
          College email
        </label>

        <input
          class="control"
          id="studentEmail"
          type="email"
          required
        >

      </div>

      <div class="field">

        <label>
          Branch
        </label>

        <select
          id="studentBranch"
          required
        >

          <option>
            Computer Science
          </option>

          <option>
            Information Technology
          </option>

          <option>
            Electronics
          </option>

        </select>

      </div>

      <div class="login-actions">

        <button
          class="primary"
          type="submit">

          Login to Upload

        </button>

        <button
          class="secondary"
          id="browseGuest"
          type="button">

          Browse Library

        </button>

      </div>

    </form>

  </div>

</section>

<div
  class="app hidden"
  id="appShell">

<header class="topbar">

  <div class="brand">

    <div class="brand-mark">
      VGU
    </div>

    <div>

      <h1>
        VGU Study Hub
      </h1>

      <span>
        Notes and Questions
      </span>

    </div>

  </div>

  <div class="user-chip">

    <span id="userLabel">
      Student
    </span>

    <div
      class="avatar"
      id="userAvatar">

      S

    </div>

    <button
      id="logoutBtn"
      type="button">

      Logout

    </button>

  </div>

</header>

<main class="layout">

<section class="main">

<form
  class="upload-box"
  id="uploadForm">

  <div class="field">

    <label>
      Note title
    </label>

    <input
      class="control"
      id="noteTitle"
      required
    >

  </div>

  <div class="field">

    <label>
      Subject
    </label>

    <input
      class="control"
      id="noteSubject"
      required
    >

  </div>

  <div class="field">

    <label>
      Semester
    </label>

    <select
      id="noteSemester"
      required>

      <option value="1">
        S1
      </option>

      <option value="2">
        S2
      </option>

      <option value="3">
        S3
      </option>

      <option value="4">
        S4
      </option>

    </select>

  </div>

  <div class="field">

    <label>
      Type
    </label>

    <select
      id="noteType"
      required>

      <option value="Notes">
        Notes
      </option>

      <option value="Question Paper">
        Question Paper
      </option>

      <option value="Lab Manual">
        Lab Manual
      </option>

    </select>

  </div>

  <div class="field">

    <label>
      PDF File
    </label>

    <input
      class="control"
      id="noteFile"
      type="file"
      accept=".pdf"
      required
    >

  </div>

  <button
    class="primary"
    type="submit">

    Upload

  </button>

</form>

<div
  class="notes-list"
  id="notesList">

</div>

</section>

<aside class="right-column">

<section class="viewer">

  <div class="viewer-head">

    <div class="viewer-title">

      <strong id="viewerName">

        Select a note

      </strong>

      <span id="viewerMeta">

        PDF preview opens here

      </span>

    </div>

    <button
      class="icon-btn"
      id="openPdf"
      type="button">

      Open

    </button>

  </div>

  <iframe
    class="pdf-frame"
    id="pdfFrame">

  </iframe>

</section>

</aside>

</main>

</div>

<script src="script.js"></script>

</body>
</html>
